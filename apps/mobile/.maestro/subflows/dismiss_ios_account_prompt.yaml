# Dismiss the iOS Apple Account sheet that can appear on unsigned-in simulators.
# This is simulator/system chrome, not Donna's Sign in with Apple flow.

appId: com.donna.caregiver

---
- tapOn:
    text: "Not Now"
    optional: true
- runFlow:
    when:
      visible: "Apple Account|Apple Account Verification|Sign in to your Apple.*Account"
    commands:
      - tapOn:
          text: "Close"
          optional: true
      - tapOn:
          text: "Not Now"
          optional: true
      - tapOn:
          point: "32%,61%"
          optional: true
      - tapOn:
          text: "Return to Donna.*"
          optional: true
      - tapOn:
          point: "10%,6%"
          optional: true
      - extendedWaitUntil:
          notVisible: "Apple Account|Apple Account Verification|Sign in to your Apple.*Account"
          timeout: 5000
