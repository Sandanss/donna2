# Flow 07: Settings — Caregiver Profile
# Verifies: Form fields, edit name/phone/relationship, email read-only, save

appId: com.donna.caregiver

env:
  TEST_EMAIL: "maestro+clerk_test@calldonna.co"
  TEST_PASSWORD: "Maestro2026!"

---

- runFlow: ../subflows/sign_in.yaml
- runFlow: ../subflows/navigate_to_settings.yaml
- tapOn: "Caregiver Profile"

- assertVisible: "Caregiver Profile"

# Form fields visible
- assertVisible: "First Name"
- assertVisible: "Last Name"
- assertVisible: "Email"
- assertVisible: "Phone Number"
- assertVisible: "City"
- assertVisible: "State"
- assertVisible: "Zip Code"

# Select relationship before opening numeric keyboards. The ZIP keypad can
# leave XCTest's tap target offset stale after scrolling this long form.
- scrollUntilVisible:
    element: "Relationship"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "caregiver-relationship-input"
- extendedWaitUntil:
    visible: "Myself"
    timeout: 5000
- tapOn: "Son"
- scrollUntilVisible:
    element: "First Name"
    direction: UP

# Edit first name
- tapOn:
    id: "caregiver-first-name-input"
- eraseText: 50
- inputText: "E2E"
- extendedWaitUntil:
    visible: "E2E"
    timeout: 3000

# Edit last name
- tapOn:
    id: "caregiver-last-name-input"
- eraseText: 50
- inputText: "Tester"
- extendedWaitUntil:
    visible: "Tester"
    timeout: 3000

# Edit phone
- tapOn:
    id: "caregiver-phone-input"
- eraseText: 50
- runFlow:
    file: ../subflows/tap_digits.yaml
    env:
      DIGITS: "5559876543"
- extendedWaitUntil:
    visible: "555.*987.*6543|5559876543"
    timeout: 3000
- tapOn: "Done"

# Edit caregiver locality
- scrollUntilVisible:
    element: "Enter city"
    direction: DOWN
    centerElement: true
- tapOn: "Enter city"
- eraseText: 50
- inputText: "Dallas"
- extendedWaitUntil:
    visible: "Dallas"
    timeout: 3000
- pressKey: enter
- scrollUntilVisible:
    element: "State"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "caregiver-state-input"
- eraseText: 2
- inputText: "TX"
- extendedWaitUntil:
    visible: "TX"
    timeout: 3000
- pressKey: enter
- scrollUntilVisible:
    element: "Enter zip code"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "caregiver-zip-input"
- eraseText: 5
- runFlow:
    file: ../subflows/tap_digits.yaml
    env:
      DIGITS: "75201"
- extendedWaitUntil:
    visible: "75201"
    timeout: 3000
- tapOn: "Done"

# Change Password button visible
- scrollUntilVisible:
    element: "Change Password"
    direction: DOWN
- assertVisible: "Change Password"

# Save changes
- scrollUntilVisible:
    element: "Save Changes"
    direction: DOWN
- tapOn: "Save Changes"

- extendedWaitUntil:
    visible: "Manage your account and preferences"
    timeout: 10000

- takeScreenshot: 07_caregiver
